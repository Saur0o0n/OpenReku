  # Jedna nakładka przygasza kartę i blokuje dotyk po wyłączeniu zasilania.
  # Przycisk zasilania ma wyższy z-index, więc pozostaje dostępny.
  - type: conditional
    conditions:
      - entity: switch.kotlownia_rekuperator_zasilanie_rekuperatora
        state: 'off'
      - entity: binary_sensor.kotlownia_rekuperator_tryb_serwisowy
        state_not: 'on'
    elements:
      # Obraz przechwytuje dotyk bez kierowania go do pobliskich kontrolek.
      - type: image
        image: 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%221%22%20height=%221%22%3E%3C/svg%3E'
        filter: none
        title: Zasilanie rekuperatora wyłączone
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        style:
          top: 0
          left: 0
          width: 100%
          height: 100%
          transform: none
          padding: 0
          box-sizing: border-box
          overflow: hidden
          z-index: 10
          background: 'rgba(180, 180, 180, 0.55)'
          backdrop-filter: grayscale(100%)
          -webkit-backdrop-filter: grayscale(100%)
          color: transparent
          font-size: 0
          pointer-events: auto
          cursor: default
  # Serwis blokuje całą kartę, zachowując widoczne odczyty i część kolorów.
  - type: conditional
    conditions:
      - entity: binary_sensor.kotlownia_rekuperator_tryb_serwisowy
        state: 'on'
    elements:
      # Obraz przechwytuje dotyk bez kierowania go do pobliskich kontrolek.
      - type: image
        image: 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%221%22%20height=%221%22%3E%3C/svg%3E'
        filter: none
        title: Tryb serwisowy rekuperatora. Sterowanie jest zablokowane.
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        style:
          top: 0
          left: 0
          width: 100%
          height: 100%
          transform: none
          padding: 0
          box-sizing: border-box
          overflow: hidden
          z-index: 30
          background: 'rgba(180, 180, 180, 0.12)'
          backdrop-filter: saturate(65%)
          -webkit-backdrop-filter: saturate(65%)
          color: transparent
          font-size: 0
          pointer-events: auto
          cursor: not-allowed
      # Stały tekst bez stanu sensora; hui-element jest już używany przez wskaźniki.
      - type: custom:hui-element
        card_type: markdown
        content: '**Tryb serwisowy rekuperatora.**'
        style:
          top: 50%
          left: 50%
          transform: translate(-50%, -50%)
          width: 70%
          max-width: 460px
          z-index: 31
          text-align: center
          font-size: clamp(16px, 2.5vw, 24px)
          --ha-card-background: 'rgba(245, 245, 245, 0.95)'
          --primary-text-color: '#263238'
          --ha-card-border-width: 0px
          pointer-events: none
grid_options:
  columns: full
